<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Prevent the redirect page itself from being cached -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <script>
        // Replace this with your new destination link
        const targetUrl = "<head>";
        
        // Generates a unique number based on the current time
        const uniqueTimestamp = new Date().getTime();
        
        // Forces a clean redirect with a fresh, cache-busting URL parameter
        window.location.replace(targetUrl + "?nocache=" + uniqueTimestamp);
    </script>

</head>
<body>
    <center>
<h1>LOADING TO NSCCOMPUTERS....</h1>
<p>If you are not redirected automatically, follow this <a href="<head>">link</a>.</p>
</center>


</body>
</html>
