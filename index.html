<script>
    // Kill and unregister any hidden service workers caching the site
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (let registration of registrations) {
                registration.unregister().then(function(boolean) {
                    console.log('Old Service Worker successfully deleted:', boolean);
                });
            }
        });
    }

    // Forcefully wipe out application Cache Storage
    if ('caches' in window) {

                caches.delete(name);
